name: Build Debian Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'  # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" = "$GITHUB_REF" ]; then VERSION="1.0.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil nvidia-ml-py PyQt6

      - name: Build Executable with Assets
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "Assets:Assets" --name "sysmon" SysMon.py

      - name: Assemble Debian Package Structure
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Create directory structure cleanly
          mkdir -p build_dir/DEBIAN
          mkdir -p build_dir/usr/bin
          mkdir -p build_dir/usr/lib/sysmon
          mkdir -p build_dir/usr/share/applications

          # Copy compiled output
          cp -r dist/sysmon/* build_dir/usr/lib/sysmon/

          # 1. Launcher Script
          cat << 'EOF' > build_dir/usr/bin/sysmon
          #!/bin/sh
          exec /usr/lib/sysmon/sysmon "$@"
          EOF
          chmod +x build_dir/usr/bin/sysmon

          # 2. Control File
          cat << EOF > build_dir/DEBIAN/control
          Package: sysmon
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: MilkshakeManiac App Soft
          Depends: libxcb-cursor0, libxcb-xinerama0, libxkbcommon-x11-0, python3
          Section: utils
          Priority: optional
          Description: System Monitor App
           Real-time hardware performance monitor built for Linux.
          EOF

          # 3. Desktop Entry
          cat << 'EOF' > build_dir/usr/share/applications/sysmon.desktop
          [Desktop Entry]
          Type=Application
          Name=System Monitor
          Comment=Real-time Hardware System Monitor
          Exec=/usr/bin/sysmon
          Icon=/usr/lib/sysmon/Assets/icon.png
          Terminal=false
          Categories=System;Utility;
          EOF

          # Set permissions required by dpkg-deb
          chmod -R 755 build_dir
          chmod 644 build_dir/DEBIAN/control

          # Build .deb package
          dpkg-deb --build --root-owner-group build_dir sysmon_${VERSION}_amd64.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysmon-deb-package
          path: sysmon_*_amd64.deb

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sysmon_*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}